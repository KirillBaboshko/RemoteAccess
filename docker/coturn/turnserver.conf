listening-port=3478
fingerprint
use-auth-secret

# Keep this range aligned with the published ports in docker-compose.yml.
# ponytail: 41 relay ports suit development; expand both ranges for more clients.
min-port=49160
max-port=49200
relay-threads=2

# TLS requires a separate certificate setup; clients use turn: for this profile.
no-tls
no-dtls
# Administrative CLI is disabled by default in the pinned coturn version.
no-multicast-peers
stale-nonce=600

log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
